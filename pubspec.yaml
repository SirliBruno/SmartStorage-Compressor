name: smart_storage_compressor
description: "A production-grade, 100% on-device video compressor and smart storage cleaner."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: '>=0.19.0 <1.0.0'
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  photo_manager: ^3.1.2
  video_player: ^2.8.6
  purchases_flutter: ^8.1.0
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  test: ^1.24.0

flutter:
  uses-material-design: true
  generate: true

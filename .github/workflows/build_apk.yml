name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure Android Project Scaffold
        run: |
          mkdir -p /tmp/backup/kotlin
          cp -r android/app/src/main/kotlin/* /tmp/backup/kotlin/
          cp android/app/src/main/AndroidManifest.xml /tmp/backup/AndroidManifest.xml
          rm -rf android
          flutter create --platforms=android --org com.smartstorage .
          cp /tmp/backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/kotlin/com/smartstorage/compressor
          cp -r /tmp/backup/kotlin/* android/app/src/main/kotlin/com/smartstorage/compressor/

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android Debug APK
        run: flutter build apk --debug --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartStorage-Compressor-Preview-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

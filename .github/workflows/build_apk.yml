name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure Android Project Scaffold
        run: |
          mkdir -p /tmp/backup/kotlin
          cp -r android/app/src/main/kotlin/com/smartstorage/smart_storage_compressor/* /tmp/backup/kotlin/
          cp android/app/src/main/AndroidManifest.xml /tmp/backup/AndroidManifest.xml
          cp android/app/build.gradle /tmp/backup/build.gradle
          rm -rf android
          flutter create --platforms=android --org com.smartstorage .
          cp /tmp/backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp /tmp/backup/build.gradle android/app/build.gradle
          mkdir -p android/app/src/main/kotlin/com/smartstorage/smart_storage_compressor
          cp -f /tmp/backup/kotlin/* android/app/src/main/kotlin/com/smartstorage/smart_storage_compressor/
          echo "=== Verified Kotlin Files ==="
          ls -la android/app/src/main/kotlin/com/smartstorage/smart_storage_compressor/

      - name: Run Flutter Tests
        run: flutter test

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android Debug APK
        run: flutter build apk --debug --android-skip-build-dependency-validation

      - name: Verify APK Integrity & Native MethodChannel
        run: |
          mkdir -p /tmp/apk_verify
          unzip -q build/app/outputs/flutter-apk/app-debug.apk -d /tmp/apk_verify
          echo "Checking for MediaCodec and video_compression in DEX..."
          grep -a "video_compression" /tmp/apk_verify/classes*.dex || (echo "FATAL: video_compression MethodChannel missing in APK DEX!" && exit 1)
          grep -a "MediaCodecVideoCompressor" /tmp/apk_verify/classes*.dex || (echo "FATAL: MediaCodecVideoCompressor missing in APK DEX!" && exit 1)
          echo "DEX verification PASSED: Native hardware engine successfully packaged in MainActivity!"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartStorage-Compressor-Preview-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
